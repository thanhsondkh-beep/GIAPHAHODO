<style>
/* Layout: sơn mài đỏ son + chỉ vàng; header ấn triện, hero đình làng + câu đối, lưới 3 cột; trên điện thoại mọi thứ xếp 1 cột, sơ đồ cuộn ngang + phóng to/thu nhỏ */
:root{
  --paper:#F5EAD2; --paper-2:#FCF6E8; --ink:#2B1A12; --muted:#76594A; --line:#E0C99B;
  --lacquer:#8E1B17; --lacquer-deep:#5A0E0B; --gold:#C29A42; --gold-soft:#EBD8A8;
  --on-lacquer:#F8E9C4; --nam:#2F5D7C; --nu:#A3445A; --hill-1:#D9C9A6; --hill-2:#C6B38C; --hill-3:#A99670;
  --shadow:0 1px 0 rgba(90,14,11,.06),0 6px 18px -10px rgba(90,14,11,.35);
  --f-display:"Playfair Display","Noto Serif",Georgia,serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-seal:"Noto Serif TC","Songti TC","SimSun",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1B1210; --paper-2:#251817; --ink:#F1E4C8; --muted:#BDA588; --line:#4A3428;
  --lacquer:#C0443A; --lacquer-deep:#3D0B09; --gold:#D8B45E; --gold-soft:#4A3822;
  --on-lacquer:#F8E9C4; --nam:#7FA9C9; --nu:#D88A9C; --hill-1:#2E2220; --hill-2:#3A2B27; --hill-3:#4A3730;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1B1210; --paper-2:#251817; --ink:#F1E4C8; --muted:#BDA588; --line:#4A3428;
  --lacquer:#C0443A; --lacquer-deep:#3D0B09; --gold:#D8B45E; --gold-soft:#4A3822;
  --on-lacquer:#F8E9C4; --nam:#7FA9C9; --nu:#D88A9C; --hill-1:#2E2220; --hill-2:#3A2B27; --hill-3:#4A3730;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px} /* tránh iPhone tự phóng to khi gõ */
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}

.top{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:linear-gradient(180deg,var(--lacquer),var(--lacquer-deep));color:var(--on-lacquer);border-bottom:2px solid var(--gold)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:inherit;cursor:pointer;background:none;border:0;padding:0}
.seal{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--on-lacquer);color:var(--lacquer-deep);font-family:var(--f-seal);font-weight:900;font-size:24px;box-shadow:0 0 0 2px var(--gold),0 0 0 4px var(--lacquer-deep);flex:none}
.brand b{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.04em;white-space:nowrap}
nav.main{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav.main::-webkit-scrollbar{display:none}
nav.main button{background:none;border:0;color:var(--on-lacquer);padding:8px 12px;border-radius:4px;white-space:nowrap;cursor:pointer;opacity:.85;font-weight:500}
nav.main button:hover{opacity:1;background:rgba(255,255,255,.08)}
nav.main button[aria-current="page"]{opacity:1;background:var(--gold);color:#3D0B09;font-weight:700}
.search{display:flex;align-items:center;background:rgba(0,0,0,.18);border:1px solid rgba(248,233,196,.35);border-radius:999px;padding:4px 6px 4px 14px}
.search input{background:none;border:0;outline:none;color:var(--on-lacquer);width:150px;font-size:15px}
.search input::placeholder{color:rgba(248,233,196,.65)}
.search button{background:none;border:0;color:var(--on-lacquer);cursor:pointer;padding:2px 6px;font-size:18px}
.acct{background:none;border:1px solid rgba(248,233,196,.45);color:var(--on-lacquer);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.acct:hover{background:rgba(255,255,255,.08)}
@media (max-width:860px){
  .top{position:relative}
  .top .wrap{gap:8px}
  .brand b{font-size:19px}.seal{width:36px;height:36px;font-size:20px}
  .acct{margin-left:auto}
  nav.main{order:3;flex-basis:100%}
  .search{order:4;flex-basis:100%}.search input{width:100%}
}

.notice{background:var(--gold-soft);border-bottom:1px solid var(--line);font-size:13.5px}
.notice .wrap{padding-block:8px;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;justify-content:space-between}

.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--paper-2),var(--paper))}
.hero svg.land{position:absolute;inset:auto 0 0 0;width:100%;height:100%;pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center;padding-block:30px 40px;gap:6px}
.hero .seal{width:64px;height:64px;font-size:36px;background:var(--lacquer);color:var(--on-lacquer);box-shadow:0 0 0 3px var(--gold),0 0 0 6px var(--paper-2)}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(38px,8vw,72px);line-height:1;margin:12px 0 0;color:var(--lacquer);letter-spacing:.03em;text-wrap:balance}
.ribbon{display:inline-block;background:var(--lacquer);color:var(--on-lacquer);font-family:var(--f-display);font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:clamp(13px,2.2vw,17px);padding:6px 26px;clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%)}
.place{font-size:13px;letter-spacing:.06em;color:var(--muted);margin-top:4px}
.couplet{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.couplet span{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:16px;color:var(--ink);background:var(--paper-2);border:1px solid var(--gold);padding:6px 14px;border-radius:3px}

.quick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-block:18px}
.quick button{display:flex;gap:10px;align-items:center;text-align:left;background:var(--paper-2);border:1px solid var(--line);border-radius:6px;padding:12px;cursor:pointer;transition:transform .15s,border-color .15s;min-width:0}
.quick button:hover{border-color:var(--gold);transform:translateY(-1px)}
.quick .ic{flex:none;width:38px;height:38px;border-radius:50%;background:var(--lacquer);color:var(--on-lacquer);display:grid;place-items:center}
.quick b{display:block;font-size:14px;color:var(--lacquer);line-height:1.25}
.quick small{color:var(--muted);font-size:12px;line-height:1.3;display:block}
@media (max-width:1050px){.quick{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}.quick button{padding:10px;gap:8px}.quick .ic{width:32px;height:32px}}

.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1.1fr) minmax(0,.85fr);gap:16px;margin-bottom:28px}
@media (max-width:1100px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.grid .p-tree{grid-column:1/-1}}
@media (max-width:720px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--paper-2);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph h2,.ph h3{margin:0;font-family:var(--f-display);font-weight:800;color:var(--lacquer);font-size:16px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.ph h2::before,.ph h3::before{content:"";width:8px;height:8px;background:var(--gold);transform:rotate(45deg)}
.pb{padding:14px}
.link{background:none;border:0;color:var(--lacquer);cursor:pointer;font-size:13.5px;font-weight:600;padding:0;text-align:left}
.link:hover{text-decoration:underline}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--lacquer);background:var(--lacquer);color:var(--on-lacquer);padding:8px 14px;border-radius:4px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{background:var(--lacquer-deep)}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:transparent;color:var(--lacquer)}
.btn.ghost:hover{background:var(--gold-soft)}
.btn.danger{background:transparent;color:var(--nu);border-color:var(--nu)}
select.f,input.f,textarea.f{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:7px 10px;min-width:0;max-width:100%}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters label{font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--lacquer);border-radius:4px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--lacquer);padding:6px 12px;cursor:pointer;font-weight:600;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--lacquer);color:var(--on-lacquer)}
.zoom{display:inline-flex;gap:4px}
.zoom button{width:32px;height:32px;border:1px solid var(--line);background:var(--paper);border-radius:4px;cursor:pointer;font-weight:700;color:var(--lacquer)}

.tree-scroll{overflow:auto;padding:16px 8px 20px;-webkit-overflow-scrolling:touch;max-height:75vh}
.tree{width:max-content;margin:0 auto}
.tree ul{position:relative;display:flex;justify-content:center;padding:20px 0 0;margin:0}
.tree>ul{padding-top:0}
.tree li{list-style:none;position:relative;padding:20px 5px 0;text-align:center}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:20px;border-top:1.5px solid var(--gold)}
.tree li::after{right:auto;left:50%;border-left:1.5px solid var(--gold)}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:only-child{padding-top:0}
.tree>ul>li{padding-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0}
.tree li:last-child::before{border-right:1.5px solid var(--gold);border-radius:0 6px 0 0}
.tree li:first-child::after{border-radius:6px 0 0 0}
.tree ul ul::before{content:"";position:absolute;top:0;left:50%;height:20px;border-left:1.5px solid var(--gold)}
.node{display:inline-flex;flex-direction:column;align-items:center;gap:1px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 8px 6px;min-width:88px;max-width:124px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.node:hover,.node.sel{border-color:var(--lacquer);box-shadow:0 0 0 2px var(--gold-soft)}
.node.chk{border-style:dashed;border-color:var(--gold)}
.node{border-top:3px solid var(--nam);min-width:110px;max-width:170px;padding:7px 9px 6px}
.node.nu{border-top-color:var(--nu)}
.node.chk{border-top-style:solid}
.node.chk.nam{border-top-color:var(--nam)} .node.chk.nu{border-top-color:var(--nu)}
.node .pp{display:flex;flex-direction:column;align-items:center;width:100%;line-height:1.25}
.node .pp.sp{border-top:1px dashed var(--line);margin-top:4px;padding-top:4px}
.node .pp span{font-size:12px;font-weight:500}
.node b{font-size:12.5px;line-height:1.25;font-weight:700}
.node small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.node em{font-style:normal;font-size:10.5px;color:var(--lacquer);font-weight:600;letter-spacing:.04em}
.node em.gen{margin-top:4px;opacity:.85}
.node.root{border:1.5px solid var(--gold);background:var(--gold-soft);min-width:130px;max-width:170px}
.node.root b{font-size:14px;font-family:var(--f-display)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--paper-2);background:var(--nam);font-size:14px;margin-bottom:3px;flex:none}
.av.nu{background:var(--nu)}
.node.root .av{width:44px;height:44px;background:var(--lacquer);color:var(--on-lacquer);font-family:var(--f-seal);font-size:22px;box-shadow:0 0 0 2px var(--gold)}
.more{font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:4px 8px;display:inline-block}
.chip{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:1px 7px;border-radius:999px;background:var(--gold-soft);color:var(--muted);vertical-align:middle;white-space:nowrap}
.chip.warn{background:transparent;border:1px dashed var(--gold);color:var(--lacquer)}

.gens{display:flex;flex-direction:column}
.gen-row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.gen-row:last-child{border-bottom:0}
.gen-row .lbl{font-family:var(--f-display);font-weight:800;color:var(--lacquer);line-height:1.15}
.gen-row .lbl small{display:block;font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:11.5px}
.people{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer;font-size:13px;line-height:1.2;text-align:left}
.pchip .av{width:24px;height:24px;font-size:11px;margin:0}
.pchip.chk{border-style:dashed;border-color:var(--gold)}
.pchip.sel{border-color:var(--lacquer);box-shadow:0 0 0 2px var(--gold-soft)}
.pchip small{color:var(--muted);font-size:11px}

.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--paper);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--paper)}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who .av{width:28px;height:28px;font-size:12px;margin:0}
@media (max-width:640px){.hide-sm{display:none}}

.prose p{margin:0 0 10px;max-width:68ch}
.excerpt{font-size:14px}
.excerpt p{margin:0 0 8px}
.giahuan{font-family:var(--f-display);font-style:italic;font-size:15.5px;line-height:1.7;margin:0;padding:0;list-style:none}
.giahuan li::before{content:"✦ ";color:var(--gold);font-style:normal;font-size:11px}
.giahuan.big{font-size:20px;line-height:1.9;text-align:center}
.giahuan.big li::before{content:""}
.section-title{font-family:var(--f-display);font-weight:800;color:var(--lacquer);font-size:clamp(26px,5vw,34px);margin:24px 0 4px;text-wrap:balance}
.section-sub{color:var(--muted);margin:0 0 16px}

.two{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;margin-bottom:28px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:28px}
.card{background:var(--paper-2);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card h3{margin:0;font-family:var(--f-display);color:var(--lacquer);font-size:19px}
.card .meta{font-size:12.5px;color:var(--muted)}
.stat{display:flex;gap:18px;flex-wrap:wrap}
.stat div b{display:block;font-family:var(--f-display);font-size:24px;color:var(--lacquer);font-variant-numeric:tabular-nums;line-height:1.1}
.stat div span{font-size:12px;color:var(--muted)}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:14px;margin:0}
.dl dt{color:var(--muted)} .dl dd{margin:0}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.pic-box{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.pic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;width:100%}
.pic-grid:empty{display:none}
.pic{position:relative;aspect-ratio:1;border-radius:4px;overflow:hidden;border:1px solid var(--line);background:var(--paper)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic-del{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:1;cursor:pointer}
.pic-add{cursor:pointer}
.news-pics{display:grid;gap:6px;margin-top:6px;grid-template-columns:repeat(3,minmax(0,1fr))}
.news-pics.n1{grid-template-columns:minmax(0,1fr)} .news-pics.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.news-pic{border-radius:4px;overflow:hidden;background:var(--gold-soft);aspect-ratio:4/3;max-width:100%}
.news-pics.n1 .news-pic{aspect-ratio:auto;max-height:480px}
.news-pic img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.news-pics.n1 .news-pic img{object-fit:contain;max-height:480px}
.news-pic.broken::after,.pic.broken::after{content:"Không tải được ảnh";display:grid;place-items:center;height:100%;font-size:12px;color:var(--muted)}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(10,4,3,.92);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:calc(100dvh - 32px);object-fit:contain}
.lightbox .x{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;color:#fff;font-size:30px}
/* Thanh menu dưới đáy (điện thoại) */
.tabbar{display:none}
@media (max-width:860px){
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:var(--lacquer-deep);border-top:2px solid var(--gold);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;background:none;border:0;color:var(--on-lacquer);opacity:.75;font-size:10.5px;font-weight:600;cursor:pointer;min-width:0}
  .tabbar button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

<script>

  view:"home",q:"",branch:"",depth:0,sel:null,treeMode:"tree",zoom:innerWidth<640?.85:1};

const years=m=>m.born?(m.died?`${m.born} – ${m.died}`:`${m.born}`):(m.died?`? – ${m.died}`:"");

function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}

/* ---------- Kho dữ liệu: bộ nhớ tạm (xem thử) hoặc Firestore ---------- */
function memoryDB(seed){
  const store={},subs={};
  for(const c of Object.keys(seed)){store[c]={};(seed[c]||[]).forEach(d=>{const {id,...r}=d;store[c][id]=r})}
  const snap=c=>({docs:Object.entries(store[c]||{}).map(([id,d])=>({id,data:()=>d}))});
  const emit=c=>(subs[c]||[]).forEach(f=>f(snap(c)));
  const logs=[],logSubs=[];
  return {collection:c=>({
    doc:id=>{id=id||"x"+Math.random().toString(36).slice(2,10);return{id,set:async d=>{(store[c]=store[c]||{})[id]=d;emit(c)},delete:async()=>{if(store[c])delete store[c][id];emit(c)}}},
    onSnapshot:f=>{(subs[c]=subs[c]||[]).push(f);setTimeout(()=>f(snap(c)));return()=>{}}}),
    log:async e=>{logs.unshift(e);logSubs.forEach(f=>f(logs.slice(0,40)))},
    batchSet:async rows=>{rows.forEach(([c,id,d])=>{(store[c]=store[c]||{})[id]=d});[...new Set(rows.map(r=>r[0]))].forEach(emit)},
    putImg:async d=>{const id="i"+Math.random().toString(36).slice(2,10);(store.images=store.images||{})[id]=d;return id},
    getImg:async id=>store.images?.[id]?.data||"",
    delImg:async id=>{if(store.images)delete store.images[id]},
    recentLog:f=>{logSubs.push(f);setTimeout(()=>f(logs.slice(0,40)));return()=>{}}};
}
async function firebaseDB(){
  const base=`https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [A,F]=await Promise.all([import(base+"firebase-app.js"),import(base+"firebase-firestore.js")]);
  const app=A.initializeApp(CFG.firebase);
  let fdb;try{fdb=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){fdb=F.getFirestore(app)}
  const DB={
    collection:c=>({
      doc:id=>{const ref=id?F.doc(fdb,c,id):F.doc(F.collection(fdb,c));return{id:ref.id,set:d=>F.setDoc(ref,d),delete:()=>F.deleteDoc(ref)}},
      onSnapshot:(f,err)=>F.onSnapshot(F.collection(fdb,c),s=>f({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))}),err)
    }),
    batchSet:async rows=>{for(let i=0;i<rows.length;i+=400){const b=F.writeBatch(fdb);rows.slice(i,i+400).forEach(([c,id,d])=>b.set(F.doc(fdb,c,id),d));await b.commit()}},
    log:e=>F.addDoc(F.collection(fdb,"changelog"),e),
    putImg:async d=>(await F.addDoc(F.collection(fdb,"images"),d)).id,
    getImg:async id=>{const s=await F.getDoc(F.doc(fdb,"images",id));return s.exists()?s.data().data:""},
    delImg:id=>F.deleteDoc(F.doc(fdb,"images",id)),
    recentLog:(f,err)=>F.onSnapshot(F.query(F.collection(fdb,"changelog"),F.orderBy("at","desc"),F.limit(40)),s=>f(s.docs.map(d=>d.data())),err)
  };
  return DB;
}
function logChange(action,col,id,label){
  return S.db?.log?.({at:Date.now(),by:ED||"Không ghi tên",action,col,docId:String(id),label:String(label||"").slice(0,120)})?.catch(()=>{});
}
function exportData(){
  const data={xuatLuc:new Date().toISOString(),members:S.members,library:S.library,news:S.news,pages:S.pages};
  const blob=new Blob([JSON.stringify(data,null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`gia-pha-ho-do-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  toast("Đã tải bản sao. Hãy cất tệp này cẩn thận.");
}
const fmtTime=t=>{const d=new Date(t);const p=n=>String(n).padStart(2,"0");return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`};

/* ---------- Dữ liệu suy ra ---------- */
let byId={},kids={};
function index(){
  byId={};kids={};for(const k in DESC)delete DESC[k];
  S.members.forEach(m=>byId[m.id]=m);
  S.members.forEach(m=>{const p=m.parentId&&byId[m.parentId]?m.parentId:"";(kids[p]=kids[p]||[]).push(m)});
  Object.values(kids).forEach(a=>a.sort((x,y)=>(x.order??0)-(y.order??0)||(parseInt(x.born)||9999)-(parseInt(y.born)||9999)||String(x.id).localeCompare(y.id)));
}
function gen(m,d=0){if(!m)return 0;if(d>80)return 1;const p=byId[m.parentId];return p?gen(p,d+1)+1:(Number(m.gen)||1)}
function branch(m,d=0){if(!m||d>80)return"";if(m.branch)return m.branch;return branch(byId[m.parentId],d+1)}
function branches(){const s=new Set();S.members.forEach(m=>{const b=branch(m);if(b)s.add(b)});return [...s].sort((a,b)=>a.localeCompare(b,"vi",{numeric:true}))}
const mainRoots=()=>(kids[""]||[]).filter(m=>gen(m)===1);
const loose=()=>(kids[""]||[]).filter(m=>gen(m)>1).sort((a,b)=>gen(a)-gen(b));
const nVerify=()=>S.members.filter(m=>m.verify).length;

const TABS=[["home","Trang chủ","home"],["giapha","Gia phả","tree"],["thanhvien","Thành viên","people"],["thuvien","Thư viện","scroll"],["tintuc","Tin · Lịch kỵ","news"]];

  $("#nav [aria-current]")?.scrollIntoView?.({block:"nearest",inline:"nearest"})}

  const g=e.target.closest("[data-go]");if(g){e.preventDefault();go(g.dataset.go);return}

{const h=location.hash.slice(1);if(NAV.some(n=>n[0]===h))S.view=h}

/* ---------- Thành phần ---------- */
const ICON={
 tree:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="4.5" r="2.5"/><circle cx="5" cy="19.5" r="2.5"/><circle cx="12" cy="19.5" r="2.5"/><circle cx="19" cy="19.5" r="2.5"/><path d="M12 7v10M5 17v-4h14v4"/></svg>',
 people:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.9.3 5 2.6 5 5.8"/></svg>',
 temple:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 9c3 0 5-2 10-5 5 3 7 5 10 5"/><path d="M5 9v11M19 9v11M3 20h18M9 20v-6h6v6"/></svg>',
 book:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 5c3-1 6-1 9 1 3-2 6-2 9-1v14c-3-1-6-1-9 1-3-2-6-2-9-1z"/><path d="M12 6v14"/></svg>',
 scroll:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
 news:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M7 9h10M7 13h10M7 17h6"/></svg>'
};
function spouses(m){
  return String(m.spouse||"").split(";").map(s=>s.trim()).filter(Boolean).map(s=>{
    const k=/^(.*?)\s*\(\s*kỵ\s*:?\s*([^)]*)\)\s*$/i.exec(s);return k?{name:k[1].trim(),ky:k[2].trim()}:{name:s,ky:""}});
}
function node(m){
  const g=gen(m);const isRoot=!byId[m.parentId]&&g===1;const sps=spouses(m);
  const kyTxt=years(m)||(m.gio?`Kỵ: ${m.gio}`:"");
  return `<div class="node ${isRoot?"root":""} ${m.gender==="nu"?"nu":"nam"} ${m.verify?"chk":""} ${S.sel===m.id?"sel":""}" data-member="${esc(m.id)}" tabindex="0" role="button">
   ${isRoot?`<span class="av">祖</span>`:""}
   ${m.title?`<em class="ttl">${esc(m.title)}</em>`:""}
   <div class="pp"><b>${esc(m.name)}</b>${kyTxt?`<small>${esc(kyTxt)}</small>`:""}</div>
   ${sps.map(s=>`<div class="pp sp"><span>${esc(s.name)}</span>${s.ky?`<small>Kỵ: ${esc(s.ky)}</small>`:""}</div>`).join("")}
   <em class="gen">Đời thứ ${g}</em>${(()=>{const d=descInfo(m.id);return d.n?`<small class="dcount">${d.n} con cháu · đến đời ${g+d.deep}</small>`:""})()}</div>`;
}
function treeHTML(list,depthLeft){
  if(!list.length)return"";
  return `<ul>${list.map(m=>{const ch=kids[m.id]||[];
    let inner="";
    if(ch.length)inner=depthLeft>1?treeHTML(ch,depthLeft-1):`<ul><li><span class="more">+${ch.length} người đời sau</span></li></ul>`;
    return `<li>${node(m)}${inner}</li>`}).join("")}</ul>`;
}
const DESC={};
function descInfo(id){
  if(DESC[id])return DESC[id];
  let n=0,deep=0;(kids[id]||[]).forEach(c=>{const d=descInfo(c.id);n+=1+d.n;deep=Math.max(deep,1+d.deep)});
  return DESC[id]={n,deep};
}
function treeRoots(){
  if(S.focus&&byId[S.focus])return [byId[S.focus]];
  if(!S.branch)return mainRoots();
  return S.members.filter(m=>branch(m)===S.branch&&branch(byId[m.parentId])!==S.branch);
}
function pchip(m,showGen){
  return `<button class="pchip ${m.verify?"chk":""} ${S.sel===m.id?"sel":""}" data-member="${esc(m.id)}"><span class="av ${m.gender==="nu"?"nu":""}">${esc(initial(m.name))}</span><span>${esc(m.name)}${showGen?` <small>· đời ${gen(m)}</small>`:""}${m.gio?` <small>· kỵ ${esc(m.gio)}</small>`:""}</span></button>`;
}
function gensHTML(){
  const by={};S.members.filter(m=>!S.branch||branch(m)===S.branch).forEach(m=>{const g=gen(m);(by[g]=by[g]||[]).push(m)});
  const gs=Object.keys(by).map(Number).sort((a,b)=>a-b);
  if(!gs.length)return `<div class="empty">Không có thành viên.</div>`;
  return `<div class="gens">${gs.map(g=>`<div class="gen-row"><div class="lbl">Đời ${g}<small>${by[g].length} người</small></div><div class="people">${
    by[g].sort((a,b)=>String(a.parentId||"").localeCompare(b.parentId||"")||String(a.id).localeCompare(b.id)).map(m=>pchip(m)).join("")}</div></div>`).join("")}</div>`;
}
function emptyMembers(){
  if(S.loading)return `<div class="empty">Đang tải gia phả…</div>`;
  const canSeed=S.canWrite&&SEED.members.length&&S.mode==="firebase";
  return `<div class="empty"><b>Chưa có thành viên nào trong gia phả</b>${
    canSeed?`Nạp ${SEED.members.length} người đã chép từ phả đồ treo ở nhà thờ họ làm dữ liệu ban đầu.<div style="margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn" data-act="seed">Nạp dữ liệu phả đồ</button><button class="btn ghost" data-act="addMember">+ Tự thêm từ đầu</button></div>`
    :S.canWrite?`<div style="margin-top:12px"><button class="btn" data-act="addMember">+ Thêm thành viên</button></div>`:"Khi ban quản lý nhập dữ liệu, sơ đồ sẽ hiện ở đây."}</div>`;
}
function filters(withMode){
  const bs=branches();const maxG=Math.max(1,...S.members.map(m=>gen(m)));
  return `<div class="filters">
   ${withMode?`<div class="seg" role="group" aria-label="Kiểu xem"><button data-act="mode" data-arg="tree" aria-pressed="${S.treeMode==="tree"}">Sơ đồ</button><button data-act="mode" data-arg="gens" aria-pressed="${S.treeMode==="gens"}">Theo đời</button></div>`:""}

   ${S.treeMode==="tree"||!withMode?`<select class="f" id="fDepth" aria-label="Số đời hiển thị"><option value="0">Toàn bộ các đời</option>${Array.from({length:maxG},(_,i)=>i+1).map(i=>`<option value="${i}" ${S.depth===i?"selected":""}>${i} đời đầu</option>`).join("")}</select>`:""}
   ${withMode&&S.treeMode==="tree"?`<span class="zoom"><button data-act="zoom" data-arg="-1" aria-label="Thu nhỏ">−</button><button data-act="zoom" data-arg="1" aria-label="Phóng to">+</button></span>`:""}
  </div>`;
}
function recentRows(n){
  const list=[...S.members].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)||gen(a)-gen(b)).slice(0,n);
  if(!list.length)return S.loading?`<div class="empty">Đang tải…</div>`:`<div class="empty">Chưa có cập nhật.</div>`;
  return `<div class="tbl-wrap"><table><thead><tr><th>Họ và tên</th><th>Ngày kỵ</th><th>Đời</th></tr></thead><tbody>${
   list.map(m=>`<tr class="click" data-member="${esc(m.id)}"><td><div class="who"><span class="av ${m.gender==="nu"?"nu":""}">${esc(initial(m.name))}</span><span>${esc(m.name)}</span></div></td><td class="num">${esc(m.gio||"—")}</td><td class="num">${gen(m)}</td></tr>`).join("")}</tbody></table></div>`;
}
const paras=t=>String(t||"").split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);
const lines=t=>String(t||"").split(/\n/).map(p=>p.trim()).filter(Boolean);
function giahuanList(big){const l=lines(S.pages.giahuan?.text);return l.length?`<ul class="giahuan ${big?"big":""}">${l.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<div class="empty">Chưa có nội dung.</div>`}

function kyList(){
  const out=[];const rx=/(\d{1,2})\s*\/\s*(\d{1,2})/;
  S.members.forEach(m=>{
    const a=rx.exec(m.gio||"");if(a)out.push({d:+a[1],mo:+a[2],who:m.name,id:m.id});
    String(m.spouse||"").split(";").forEach(s=>{const b=/^(.*?)\(kỵ\s*(\d{1,2})\s*\/\s*(\d{1,2})\)/i.exec(s.trim());if(b)out.push({d:+b[2],mo:+b[3],who:b[1].trim()+` (vợ/chồng cụ ${m.name.replace(/^Đỗ\s+/,"")})`,id:m.id})});
  });
  return out.filter(x=>x.mo>=1&&x.mo<=12).sort((a,b)=>a.mo-b.mo||a.d-b.d);
}

function ancestors(m){const a=[];let p=byId[m?.parentId],k=0;while(p&&k++<80){a.unshift(p);p=byId[p.parentId]}return a}

/* So sánh dữ liệu phả đồ đi kèm app với dữ liệu đang có trên Firebase */
function seedPlan(){
  const add=[],fix=[];
  const keys=["name","parentId","gio","spouse","note","gender","title","branch","gen","order","verify"];
  for(const sm of SEED.members){
    const cur=byId[sm.id];
    if(!cur){add.push(sm);continue}
    if(cur.editedBy){                                  // người đã có ai sửa tay: giữ nguyên, chỉ gắn thân phụ nếu đang trống
      if(!cur.parentId&&sm.parentId&&byId[sm.parentId]!==undefined||(!cur.parentId&&sm.parentId&&SEED.members.some(x=>x.id===sm.parentId))){const {id,...rest}=cur;fix.push({...rest,id:sm.id,parentId:sm.parentId})}
      continue}
    if(keys.some(k=>(cur[k]??"")!==(sm[k]??"")))fix.push(sm);
  }
  return {add,fix};
}
function renderNotice(){
  const bits=[];
  if(S.mode==="demo")bits.push(`<span><b>Bản xem thử</b> – chưa kết nối Firebase. Có thể thử sửa, nhưng tải lại trang là mất.</span>`);
  else if(S.failed)bits.push(`<span>Không kết nối được máy chủ dữ liệu. Kiểm tra mạng rồi tải lại trang.</span>`);
  const upd=seedPlan();
  if(!S.loading&&S.members.length&&(upd.add.length||upd.fix.length))bits.push(`<span>Có bản phả đồ đầy đủ 11 đời: bổ sung <b>${upd.add.length}</b> người, cập nhật ${upd.fix.length} người chưa ai sửa.</span><button class="btn" data-act="seedUpdate">Cập nhật phả đồ</button>`);
  if(!S.loading&&nVerify())bits.push(`<span>${nVerify()} người (viền nét đứt) cần đối chiếu thân phụ với phả đồ gốc.</span>`);
  $("#notice").innerHTML=bits.length?`<div class="notice"><div class="wrap">${bits.join("")}</div></div>`:"";
}

  addMember:()=>memberForm(null,""),

  viewBranch:b=>{S.branch=b;S.depth=0;S.focus=null;go("giapha")},

  unfocus:()=>{S.focus=null;render()},
  lineage:id=>{S.lineage=id;S.sel=id;render();const c=document.querySelector(".ax-card.me");if(c)c.scrollIntoView({behavior:"smooth",block:"center"})},
  unlineage:()=>{S.lineage=null;render()},

  editPage:k=>pageForm(k),
  addLib:()=>libForm(null),editLib:id=>libForm(S.library.find(d=>d.id===id)),
  addNews:()=>newsForm(null),editNews:id=>newsForm(S.news.find(d=>d.id===id)),
  seed:async(_,btn)=>{
    btn.disabled=true;btn.textContent="Đang nạp…";const t=Date.now();
    const rows=[];
    SEED.members.forEach(({id,...d},i)=>rows.push(["members",id,{...d,updatedAt:t-i}]));
    SEED.library.forEach(({id,...d})=>rows.push(["library",id,{...d,updatedAt:t}]));
    (SEED.news||[]).forEach(({id,...d})=>rows.push(["news",id,{...d,updatedAt:t}]));
    SEED.pages.forEach(({id,...d})=>rows.push(["pages",id,{...d,updatedAt:t}]));
    try{await S.db.batchSet(rows);logChange("Nạp dữ liệu","members","*",`${SEED.members.length} người từ phả đồ`);toast(`Đã nạp ${SEED.members.length} người`)}catch(e){btn.disabled=false;btn.textContent="Nạp dữ liệu phả đồ";writeErr(e)}
  },
  seedUpdate:async(_,btn)=>{
    const {add,fix}=seedPlan();btn.disabled=true;btn.textContent="Đang cập nhật…";const t=Date.now();
    const rows=[...add,...fix].map(({id,...d},i)=>["members",id,{...d,updatedAt:t-i}]);
    try{await S.db.batchSet(rows);logChange("Cập nhật phả đồ","members","*",`Bổ sung ${add.length}, cập nhật ${fix.length} người (bản 11 đời)`);toast(`Đã bổ sung ${add.length} người`)}
    catch(e){btn.disabled=false;btn.textContent="Cập nhật phả đồ";writeErr(e)}
  },
  export:()=>exportData()
};
function writeErr(e){
  const c=String(e?.code||"");
  if(c.includes("permission-denied"))toast("Máy chủ từ chối thay đổi này. Kiểm tra lại firestore.rules.");
  else if(c.includes("resource-exhausted"))toast("Đã vượt hạn mức miễn phí hôm nay. Thử lại vào ngày mai.");
  else toast("Chưa lưu được. Kiểm tra kết nối rồi thử lại.");
}

function closeModal(){$("#modalRoot").innerHTML="";document.body.style.overflow=""}
function modal(title,fieldsHTML,onSave,onDelete){
  document.body.style.overflow="hidden";
  $("#modalRoot").innerHTML=`<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
   <header><h3 id="mTitle">${esc(title)}</h3><button class="x" id="mClose" aria-label="Đóng">×</button></header>
   <form id="mForm">${fieldsHTML}
   <label class="full" style="border-top:1px solid var(--line);padding-top:12px">Người cập nhật (tên bạn – ghi vào nhật ký)<input class="f" id="fEditor" name="__editor" required maxlength="60" placeholder="VD: Đỗ Văn A – đời 9, chi Hải Thanh" value="${esc(ED)}"></label>
   <div class="actions">${onDelete?`<button type="button" class="btn danger left" id="mDel">Xóa</button>`:""}<button type="button" class="btn ghost" id="mCancel">Hủy</button><button class="btn" type="submit" id="mSave">Lưu</button></div></form></div></div>`;
  $("#mClose").onclick=$("#mCancel").onclick=closeModal;
  $("#scrim").addEventListener("mousedown",e=>{if(e.target.id==="scrim")closeModal()});
  const takeEditor=()=>{ED=$("#fEditor").value.trim();try{localStorage.setItem("giapha_editor",ED)}catch(e){}return !!ED};
  $("#mForm").addEventListener("submit",async e=>{e.preventDefault();takeEditor();const b=$("#mSave");b.disabled=true;b.textContent="Đang lưu…";
    try{await onSave(new FormData(e.target));closeModal();toast("Đã lưu");render()}catch(err){b.disabled=false;b.textContent="Lưu";writeErr(err)}});
  if(onDelete)$("#mDel").onclick=async ev=>{const b=ev.currentTarget;
    if(!takeEditor()){$("#fEditor").focus();toast("Ghi tên bạn trước khi xóa.");return}
    if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Bấm lần nữa để xóa";return}
    b.disabled=true;try{await onDelete();closeModal();toast("Đã xóa");render()}catch(err){writeErr(err)}};
  if(innerWidth>640)setTimeout(()=>$("#mForm input,#mForm textarea")?.focus(),30);
}

function newsForm(n){
  const isNew=!n;n=n||{date:new Date().toISOString().slice(0,10)};
  modal(isNew?"Đăng thông báo":"Sửa thông báo",`
   <label class="full">Tiêu đề<input class="f" id="nTitle" name="title" required value="${esc(n.title||"")}"></label>
   <label>Ngày<input class="f" id="nDate" name="date" type="date" value="${esc(n.date||"")}"></label>
   <label class="full">Nội dung<textarea class="f" id="nBody" name="body" rows="6">${esc(n.body||"")}</textarea></label>
   ${picFieldHTML(8,"app tự thu nhỏ trước khi lưu")}`,
   async fd=>{const images=await pp.commit();
     const data={title:fv(fd,"title"),date:fv(fd,"date"),body:fv(fd,"body"),images,updatedAt:Date.now(),editedBy:ED};
     const ref=S.db.collection("news").doc(isNew?undefined:n.id);await ref.set(data);
     logChange(isNew?"Đăng thông báo":"Sửa thông báo","news",ref.id,data.title+(images.length?` (${images.length} ảnh)`:""))},
   isNew?null:async()=>{await S.db.collection("news").doc(n.id).delete();await pp.removeAll();logChange("Xóa thông báo","news",n.id,n.title)});
  const pp=picPicker(n.images||[],8,false);
}

/* Ô chọn ảnh dùng chung cho Thông báo và Thư viện */
function picFieldHTML(max,note){
  return `<div class="full pic-box"><div class="sp-head">Hình ảnh <span>(tối đa ${max} ảnh, ${note})</span></div>
     <div class="pic-grid" id="picGrid"></div>
     <label class="btn ghost pic-add" for="picInput">+ Chèn ảnh</label>
     <input type="file" id="picInput" accept="image/*" multiple hidden>
     <small id="picMsg" style="color:var(--muted)"></small></div>`;
}
function picPicker(ids,max,hiRes){
  let pics=ids.map(id=>({id}));const old=new Set(ids);
  const grid=$("#picGrid"),msg=$("#picMsg"),add=$(".pic-add");
  const draw=()=>{
    grid.innerHTML=pics.map((p,i)=>`<div class="pic"><img alt="Ảnh ${i+1}" ${p.data?`src="${p.data}"`:`data-img="${esc(p.id)}"`}><button type="button" class="pic-del" data-i="${i}" aria-label="Bỏ ảnh">×</button></div>`).join("");
    grid.querySelectorAll(".pic-del").forEach(b=>b.onclick=()=>{pics.splice(+b.dataset.i,1);draw()});
    hydrateImgs(grid);add.hidden=pics.length>=max;
  };
  $("#picInput").addEventListener("change",async e=>{
    const files=[...e.target.files].slice(0,max-pics.length);e.target.value="";
    for(const f of files){
      msg.textContent=`Đang thu nhỏ ${f.name}…`;
      try{pics.push({data:await shrinkImage(f,hiRes)});draw()}catch(err){toast(`Không đọc được ảnh ${f.name}`)}
    }
    msg.textContent="";
  });
  draw();
  return {
    async commit(){
      if(pics.some(p=>p.data))msg.textContent="Đang tải ảnh lên…";
      const out=[];
      for(const p of pics){ if(p.id){out.push(p.id);continue} p.id=await S.db.putImg({data:p.data,at:Date.now(),by:ED});delete p.data;out.push(p.id) }
      for(const id of old) if(!out.includes(id)) await S.db.delImg(id).catch(()=>{});
      return out;
    },
    async removeAll(){for(const id of old)await S.db.delImg(id).catch(()=>{})}
  };
}

/* ---------- Ảnh: thu nhỏ trên máy rồi lưu vào Firestore (collection "images") ---------- */
function shrinkImage(file,hiRes){
  const tiers=hiRes?[[2000,.78],[1600,.72],[1280,.66],[1024,.6]]:[[1280,.72],[1024,.62],[800,.55]];
  const limit=hiRes?650000:420000;
  return new Promise((ok,fail)=>{
    const url=URL.createObjectURL(file);const im=new Image();
    im.onload=()=>{
      let out="";
      for(const [max,q] of tiers){
        const k=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
        const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
        out=c.toDataURL("image/jpeg",q);if(out.length<limit)break;
      }
      URL.revokeObjectURL(url);ok(out);
    };
    im.onerror=()=>{URL.revokeObjectURL(url);fail()};
    im.src=url;
  });
}
const IMG={};
function loadImg(id){
  if(!IMG[id])IMG[id]=S.db.getImg(id).catch(()=>{delete IMG[id];return ""});
  return IMG[id];
}
function hydrateImgs(root=document){
  root.querySelectorAll("img[data-img]:not([src])").forEach(async img=>{
    const d=await loadImg(img.dataset.img);if(d)img.src=d;else img.closest(".pic,.news-pic")?.classList.add("broken");
  });
}
function openLightbox(src){
  if(!src)return;
  const d=document.createElement("div");d.className="lightbox";d.innerHTML=`<img alt="Ảnh phóng to" src="${src}"><button class="x" aria-label="Đóng">×</button>`;
  d.onclick=()=>d.remove();document.body.appendChild(d);
}
document.addEventListener("click",e=>{const im=e.target.closest(".news-pic img");if(im)openLightbox(im.src)});

/* ---------- Khởi động ---------- */
function subscribe(){
  const got=new Set();const done=k=>{got.add(k);if(got.size>=4)S.loading=false;render()};
  const err=e=>{console.error(e);S.failed=true;S.loading=false;render()};
  S.db.collection("members").onSnapshot(s=>{S.members=s.docs.map(d=>({id:d.id,...d.data()}));done("m")},err);
  S.db.collection("library").onSnapshot(s=>{S.library=s.docs.map(d=>({id:d.id,...d.data()}));done("l")},err);
  S.db.collection("news").onSnapshot(s=>{S.news=s.docs.map(d=>({id:d.id,...d.data()}));done("n")},err);
  S.db.collection("pages").onSnapshot(s=>{S.pages={};s.docs.forEach(d=>S.pages[d.id]=d.data());done("p")},err);
  S.db.recentLog(l=>{S.log=l;if(S.view==="thanhvien")render()},e=>console.warn(e));
}
render();
(async()=>{
  if(DEMO){S.db=memoryDB({members:SEED.members,library:SEED.library,news:SEED.news||[],pages:SEED.pages});subscribe();return}
  try{
    S.db=await firebaseDB();
    subscribe();
  }catch(e){console.error(e);S.failed=true;S.loading=false;render()}
})();
/* Tự kiểm tra bản mới (điện thoại hay giữ bản cũ trong bộ nhớ đệm) */
$("#ver").textContent="Phiên bản "+APP_VER;
async function checkUpdate(){
  if(DEMO||!/^https?:/.test(location.protocol))return;
  try{
    const r=await fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"});const t=await r.text();
    const m=/const APP_VER="([^"]+)"/.exec(t);
    if(m&&m[1]!==APP_VER){
      let n=0;try{n=+sessionStorage.getItem("gp_reload")||0}catch(e){}
      if(n<2){try{sessionStorage.setItem("gp_reload",n+1)}catch(e){}
        if(navigator.serviceWorker)for(const r of await navigator.serviceWorker.getRegistrations())await r.update().catch(()=>{});
        if(window.caches)for(const k of await caches.keys())await caches.delete(k);
        location.reload();}
    }else{try{sessionStorage.removeItem("gp_reload")}catch(e){}}
  }catch(e){}
}
checkUpdate();document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkUpdate()});
if("serviceWorker" in navigator&&location.protocol==="https:"&&!DEMO){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
